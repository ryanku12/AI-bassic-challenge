<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentum</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 우측 상단: 날씨 위젯 -->
    <div class="weather hidden" id="weather">
      <span class="weather__city" id="weather-city"></span>
      <span class="weather__temp" id="weather-temp"></span>
      <span class="weather__desc" id="weather-desc"></span>
    </div>

    <!-- 좌측 상단: 로그아웃 (로그인 후 노출) -->
    <button class="logout hidden" id="logout-btn" type="button">로그아웃</button>

    <main class="container">
      <!-- 시계 -->
      <section class="clock">
        <h1 class="clock__time" id="clock-time">00:00:00</h1>
        <p class="clock__date" id="clock-date"></p>
      </section>

      <!-- 로그인 폼 (비로그인 상태에서만 노출) -->
      <form class="login-form" id="login-form">
        <input
          class="login-form__input"
          type="text"
          id="login-input"
          placeholder="이름을 입력하세요"
          maxlength="15"
          required
        />
        <button class="login-form__btn" type="submit">로그인</button>
      </form>

      <!-- 대시보드: 인사 + 투두리스트 (로그인 후 노출) -->
      <section class="dashboard hidden" id="dashboard">
        <h2 class="greeting" id="greeting"></h2>

        <div class="todo">
          <h3 class="todo__title">할 일 목록</h3>

          <form class="todo__form" id="todo-form">
            <input
              class="todo__input"
              type="text"
              id="todo-input"
              placeholder="새로운 할 일을 입력하세요"
              maxlength="50"
              required
            />
            <button class="todo__add" type="submit">추가</button>
          </form>

          <ul class="todo__list" id="todo-list"></ul>
        </div>
      </section>
    </main>

    <!-- 모듈별 분리: 의존성이 없는 순서대로 로드 -->
    <script src="background.js"></script>
    <script src="clock.js"></script>
    <script src="login.js"></script>
    <script src="todo.js"></script>
    <script src="weather.js"></script>
  </body>
</html>
